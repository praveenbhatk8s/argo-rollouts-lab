apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/praveenbhatk8s/argo-rollouts-lab.git
    targetRevision: main
    path: apps/rollouts-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: rollouts-demo
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      name: rollouts-demo
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
